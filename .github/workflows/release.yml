name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Baked into the Rust shell so the bundled updater prefers the CDN.
      # Leave the secret unset to ship a GitHub/Gitee-only build.
      ORIEL_UPDATE_CDN: ${{ secrets.CDN_PUBLIC_BASE }}
      # Gitee mirror repo. This is the China-facing download source.
      ORIEL_UPDATE_GITEE_REPO: rain-drops/oriel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / smoke
        run: |
          npm run typecheck
          npm run smoke

      - name: Build desktop installer
        run: npm run build:desktop

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$FILE" ]; then
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the installers for the mirror jobs
        uses: actions/upload-artifact@v4
        with:
          name: installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Re-running the job must replace the previous assets, not fail on them.
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}

      # Gitee's REST API is rate limited hard enough that the updater cannot
      # rely on it, so mirror the release into a static file the client reads
      # through the raw endpoint instead.
      - name: Publish the mirror manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout -B manifest origin/main
          node scripts/update-manifest.mjs "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle docs/release-notes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
            exit 0
          fi
          git commit -m "Update mirror manifest for ${GITHUB_REF_NAME}"
          git push origin manifest:main

  # The China-facing mirror. Code/tags are pushed to Gitee and the same
  # installers are attached to a Gitee release, so the in-app updater can fall
  # back to gitee.com when github.com is slow or blocked.
  mirror:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for a Gitee token
        id: token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'yes'
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'yes'
        with:
          name: installers
          path: artifacts

      - name: Ensure the Gitee repository exists
        if: steps.token.outputs.present == 'yes'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -euo pipefail
          TARGET_OWNER="${GITEE_OWNER:-rain-drops}"
          TARGET_REPO="${GITEE_REPO:-oriel}"
          API="https://gitee.com/api/v5"
          if curl -fsSL "${API}/repos/${TARGET_OWNER}/${TARGET_REPO}?access_token=${GITEE_TOKEN}" > /dev/null; then
            echo "repository exists"
            exit 0
          fi
          curl -fsSL -X POST "${API}/user/repos" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            --data-urlencode "name=${TARGET_REPO}" \
            --data-urlencode "path=${TARGET_REPO}" \
            --data-urlencode "private=false" \
            --data-urlencode "auto_init=false" > /dev/null

      - name: Push code and tags to Gitee
        if: steps.token.outputs.present == 'yes'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set -euo pipefail
          TARGET_OWNER="${GITEE_OWNER:-rain-drops}"
          TARGET_REPO="${GITEE_REPO:-oriel}"
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${TARGET_OWNER}/${TARGET_REPO}.git"
          git push gitee "refs/remotes/origin/*:refs/heads/*" --tags --force

      - name: Mirror release assets to Gitee
        if: steps.token.outputs.present == 'yes'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TARGET_OWNER="${GITEE_OWNER:-rain-drops}"
          TARGET_REPO="${GITEE_REPO:-oriel}"
          API="https://gitee.com/api/v5/repos/${TARGET_OWNER}/${TARGET_REPO}"
          NOTES=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}" \
            | jq -r '.body // ""')

          RELEASE_ID=$(curl -fsSL \
            "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | jq -r '.id // empty' || true)

          if [ -z "${RELEASE_ID}" ]; then
            RELEASE_ID=$(curl -fsSL -X POST "${API}/releases" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "name=Oriel ${TAG}" \
              --data-urlencode "body=${NOTES}" \
              --data-urlencode "target_commitish=main" \
              | jq -r '.id // empty')
          fi

          if [ -z "${RELEASE_ID}" ]; then
            echo "Gitee release could not be created"
            exit 1
          fi

          EXISTING=$(curl -fsSL \
            "${API}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
            | jq -r '.[].name' || true)

          for file in $(find artifacts -type f); do
            name=$(basename "$file")
            if echo "${EXISTING}" | grep -Fxq "$name"; then
              echo "skip ${name} (already attached)"
              continue
            fi
            echo "uploading ${name}"
            curl -fsSL -X POST "${API}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${file}" > /dev/null
          done

  # Optional S3-compatible CDN (Cloudflare R2, Aliyun OSS, MinIO, …). Set the
  # CDN_* secrets and CDN_PUBLIC_BASE to have the installer uploaded to
  # <CDN_PUBLIC_BASE>/<tag>/<file>, which is exactly the layout the updater
  # expects. Without the secrets this job does nothing.
  cdn:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for CDN credentials
        id: cdn
        env:
          ENDPOINT: ${{ secrets.CDN_ENDPOINT }}
          BUCKET: ${{ secrets.CDN_BUCKET }}
          KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.CDN_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ENDPOINT" ] && [ -n "$BUCKET" ] && [ -n "$KEY_ID" ] && [ -n "$SECRET" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.cdn.outputs.present == 'yes'
        with:
          name: installers
          path: artifacts

      - name: Upload installers to the CDN bucket
        if: steps.cdn.outputs.present == 'yes'
        env:
          ENDPOINT: ${{ secrets.CDN_ENDPOINT }}
          BUCKET: ${{ secrets.CDN_BUCKET }}
          KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.CDN_SECRET_ACCESS_KEY }}
          PROVIDER: ${{ secrets.CDN_PROVIDER }}
          REGION: ${{ secrets.CDN_REGION }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash

          mkdir -p ~/.config/rclone
          {
            echo "[cdn]"
            echo "type = s3"
            echo "provider = ${PROVIDER:-Cloudflare}"
            echo "endpoint = ${ENDPOINT}"
            echo "access_key_id = ${KEY_ID}"
            echo "secret_access_key = ${SECRET}"
            echo "region = ${REGION:-auto}"
          } > ~/.config/rclone/rclone.conf

          # The updater asks for <base>/<tag>/<file>, so flatten the artifact tree.
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          rclone copy upload "cdn:${BUCKET}/${TAG}" --s3-no-check-bucket
