name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / smoke
        run: |
          npm run typecheck
          npm run smoke

      - name: Build service and web bundle
        run: npm run build

      - name: Package service (sidecar payload)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-server | Out-Null
          Copy-Item server/dist -Destination dist-server -Recurse
          Copy-Item package.json, package-lock.json, packages -Destination dist-server -Recurse
          Compress-Archive -Path dist-server/* -DestinationPath oriel-server.zip -Force

      - name: Build desktop installer
        run: npm run build:desktop

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oriel-server.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

  # Optional: mirror the repository to Gitee (configure the GITEE_TOKEN secret).
  # `secrets` is not allowed in a job-level `if`, and using it there made the
  # whole workflow invalid -> a failed run on every push. Probe it in a step.
  mirror:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for a Gitee token
        id: token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'yes'
        with:
          fetch-depth: 0

      - name: Push to Gitee
        if: steps.token.outputs.present == 'yes'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${{ github.repository_owner }}/Oriel.git"
          git push gitee "refs/remotes/origin/*:refs/heads/*" --tags --force
