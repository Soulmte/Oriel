[package]
name = "oriel-service"
version.workspace = true
edition.workspace = true
description = "Local REST service for Oriel"

[lib]
name = "oriel_service"
path = "src/lib.rs"

[[bin]]
name = "oriel-service"
path = "src/main.rs"

[dependencies]
oriel-core = { path = "../oriel-core" }
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
notify = "8"
ureq = { version = "2", features = ["json"] }
